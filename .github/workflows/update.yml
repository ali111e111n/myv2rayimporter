name: Update subscription

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download xray-knife
        run: |
          curl -sSL -o xk.zip https://github.com/lilendian0x00/xray-knife/releases/latest/download/Xray-knife-linux-64.zip
          unzip -o -q xk.zip xray-knife
          chmod +x xray-knife
          rm xk.zip

      - name: Collect and test configs
        env:
          CHANNELS: "meliproxyy"
          MAX_AGE_HOURS: "48"
          MAX_CONFIGS: "30"
          MAX_DELAY: "3000"
          KEEP_IR_HOSTS: "1"
          MAX_IR: "10"
        run: python collector.py

      - name: Commit
        run: |
          git config user.name  "sub-bot"
          git config user.email "sub-bot@users.noreply.github.com"
          git add sub.txt sub_plain.txt 2>/dev/null || true
          git diff --cached --quiet || git commit -m "update $(date -u +'%Y-%m-%d %H:%M')"
          git push
