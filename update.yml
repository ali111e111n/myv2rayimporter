name: Update subscription

on:
  schedule:
    - cron: "17 */2 * * *"   # هر ۲ ساعت
  workflow_dispatch:          # دکمه اجرای دستی

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect configs
        env:
          CHANNELS: "meliproxyy"      # چند کانال؟ با کاما جدا کنید: "meliproxyy,channel2"
          MAX_AGE_HOURS: "48"
          TCP_CHECK: "1"
        run: python collector.py

      - name: Commit
        run: |
          git config user.name  "sub-bot"
          git config user.email "sub-bot@users.noreply.github.com"
          git add sub.txt sub_plain.txt 2>/dev/null || true
          git diff --cached --quiet || git commit -m "update $(date -u +'%Y-%m-%d %H:%M')"
          git push
